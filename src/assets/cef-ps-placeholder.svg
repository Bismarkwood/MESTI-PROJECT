<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1A12" />
      <stop offset="50%" stop-color="#0D3B23" />
      <stop offset="100%" stop-color="#145A32" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ECC71" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#27AE60" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Decorative Pattern -->
  <circle cx="400" cy="300" r="240" fill="none" stroke="url(#circleGrad)" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="400" cy="300" r="180" fill="url(#circleGrad)" stroke="#2ECC71" stroke-width="1" stroke-opacity="0.3" />
  <circle cx="400" cy="300" r="120" fill="none" stroke="#2ECC71" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Central Recycle / Circular Economy Emblem -->
  <g transform="translate(400, 260) scale(1.4)" filter="url(#glow)">
    <path d="M 0,-40 A 40,40 0 0,1 34.6,20 L 20,20 A 24,24 0 0,0 0,-24 Z" fill="#2ECC71" />
    <polygon points="34.6,20 45,5 45,35" fill="#2ECC71" />
    
    <path d="M 34.6,20 A 40,40 0 0,1 -34.6,20 L -20,20 A 24,24 0 0,0 20,20 Z" fill="#27AE60" />
    <polygon points="-34.6,20 -25,35 -45,35" fill="#27AE60" />

    <path d="M -34.6,20 A 40,40 0 0,1 0,-40 L 0,-24 A 24,24 0 0,0 -20,20 Z" fill="#58D68D" />
    <polygon points="0,-40 -10,-55 10,-55" fill="#58D68D" />
  </g>

  <!-- Text elements -->
  <text x="400" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    CEF-PS · GEF 10401
  </text>
  <text x="400" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#A9DFBF" text-anchor="middle" letter-spacing="1">
    NATIONAL CIRCULAR PLASTICS PROJECT
  </text>
  <text x="400" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#7DCEA0" text-anchor="middle" opacity="0.8">
    [ Image Upload Pending · Official Project Asset ]
  </text>
</svg>
